# workflow-manager's own verification: the full test selection
# (`python3 tests/run_all.py`), split across a matrix of shards that the
# planner computes -- there is no shard list in this file. Pull requests,
# `main` pushes, the nightly run and dispatches all run the same selection.
#
#   plan       discovers the inventory and writes plan.json; its shard list
#              becomes the matrix.
#   shard      runs one shard of the plan (phase A) and uploads its results.
#   package    builds and proves the Manager's release assets, as the release
#              does (tools/release/package.py).
#   aggregate  verifies every shard's results against the plan, runs phase B
#              (the frozen-matrix merge) and reports. It also fails when the
#              plan or package job did not succeed. Its exit code is the
#              verdict: it is the one required test check.
#
# release.yml publishes a Manager release from a green `main` push run of
# this workflow, and requires that run's plan to be the full selection.
#
# Every file the tooling writes lives under $RUNNER_TEMP, never in the
# checkout, so each job's tree digest equals the plan job's. Every job that
# runs tests primes the Workflow release cache first; each restores the same
# cache directory, keyed by the pin file, so a normal run downloads nothing. This workflow is
# not managed by workflow-manager; workflow-conformance.yml is, and stays as
# installed. See docs/ARCHITECTURE.md, "Verification execution".
name: Workflow manager verification

on:
  pull_request:
  push:
    branches: [main]
  # The nightly full run of the default branch.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      shards:
        description: "Shard count, 1-256 (empty: the planner's own count; 1: the serial CI reference)"
        required: false
        default: ""

# A pull request keeps its per-ref group, and a new push cancels its stale
# run. Every other run (push, nightly, dispatch) gets its own per-event,
# per-commit group and is never cancelled, so no `main` commit loses its run.
concurrency:
  group: workflow-manager-verify-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Job timeouts bound a hung job well below GitHub's 360-minute default.
  # Each chunk has its own timeout too; the shard's allows the single-shard
  # reference (`shards=1`, about 110 minutes).
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORKFLOW_MANAGER_RELEASE_CACHE: ${{ runner.temp }}/workflow-manager-releases
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore the release cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/workflow-manager-releases
          key: workflow-releases-${{ hashFiles('src/workflow_manager/published_releases.json') }}
      - name: Plan
        id: plan
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          export TMPDIR="$RUNNER_TEMP/tmp"
          python3 tests/run_all.py --plan-only --profile ci --out "$RUNNER_TEMP/plan.json" ${SHARDS:+--shards "$SHARDS"}
          python3 -c 'import json, sys; n = json.load(open(sys.argv[1]))["n"]; print("shards=" + json.dumps(list(range(n)), separators=(",", ":")))' "$RUNNER_TEMP/plan.json" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: ${{ runner.temp }}/plan.json
          if-no-files-found: error

  shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    name: shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      WORKFLOW_MANAGER_RELEASE_CACHE: ${{ runner.temp }}/workflow-manager-releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore the release cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/workflow-manager-releases
          key: workflow-releases-${{ hashFiles('src/workflow_manager/published_releases.json') }}
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: ${{ runner.temp }}
      - name: Run shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          export TMPDIR="$RUNNER_TEMP/tmp"
          python3 tests/run_all.py --run-shard "$SHARD" --plan "$RUNNER_TEMP/plan.json" --results "$RUNNER_TEMP/out/"
      # Uploaded whatever the verdict; a shard that uploads nothing makes the
      # aggregate fail as incomplete.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: ignore

  # The release's own build-and-verify path, on every run, so a packaging
  # break is caught on the pull request and not at release time. `releases` lists the wheel's pins, and `verify` resolves the
  # checkout's recorded release through the release cache, downloading it
  # from the published source only on a cache miss.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore the release cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/workflow-manager-releases
          key: workflow-releases-${{ hashFiles('src/workflow_manager/published_releases.json') }}
      - name: Build and verify the package
        env:
          WORKFLOW_MANAGER_RELEASE_CACHE: ${{ runner.temp }}/workflow-manager-releases
        run: |
          python3 -m pip install -r .github/tools/requirements.txt
          python3 tools/release/package.py --version 0.0.0+ci --out "$RUNNER_TEMP/dist"

  aggregate:
    needs: [plan, shard, package]
    # Always, so a failed, missing or cancelled shard, plan or package fails
    # this required check rather than skipping it.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WORKFLOW_MANAGER_RELEASE_CACHE: ${{ runner.temp }}/workflow-manager-releases
    steps:
      - name: Require the plan and package jobs
        id: needs
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          status=0
          if [ "$PLAN_RESULT" != success ]; then echo "::error::the plan job concluded $PLAN_RESULT"; status=1; fi
          if [ "$PACKAGE_RESULT" != success ]; then echo "::error::the package job concluded $PACKAGE_RESULT"; status=1; fi
          exit "$status"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore the release cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/workflow-manager-releases
          key: workflow-releases-${{ hashFiles('src/workflow_manager/published_releases.json') }}
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        with:
          pattern: results-shard-*
          path: ${{ runner.temp }}/out/
      - name: Aggregate
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          export TMPDIR="$RUNNER_TEMP/tmp"
          python3 tests/run_all.py --aggregate "$RUNNER_TEMP/out/" --plan "$RUNNER_TEMP/plan.json"
      # The aggregate's own run directory (phase B records, results.json).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-aggregate
          path: ${{ runner.temp }}/tmp/wm-run-*/
          if-no-files-found: ignore
