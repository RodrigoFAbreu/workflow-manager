[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-manager"
# Placeholder only: the Git tag is the Manager's only version authority. The
# release sets the real version at build time, in a temporary copy
# (tools/release/release.py set-version). Never edit this line by hand.
version = "0.0.0.dev0"
description = "Workflow distribution, bootstrap, update and verification tooling"
requires-python = ">=3.11"

[project.scripts]
workflow-manager = "workflow_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]