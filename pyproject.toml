[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-manager"
version = "1.0.0"
description = "Workflow distribution, bootstrap, update and verification tooling"
requires-python = ">=3.11"

[project.scripts]
workflow-manager = "workflow_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]